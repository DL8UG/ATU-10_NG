# Links and "Contents" lists of the Markdown documentation
name: Docs

on:
  push:
    paths: ["**.md", "docs/**", "tools/check_doc_links.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", "docs/**", "tools/check_doc_links.py", ".github/workflows/docs.yml"]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_doc_links.py
